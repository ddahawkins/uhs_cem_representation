# Weather coverage: hourly UTC, April 2009 through March 2024.
# A labelled weather year starts on 1 April and ends on 31 March.
# All ranges are inclusive and remain within the available dataset.
# Keep scenario names distinct from override names for Calliope 0.7.

scenarios:
  # Complete, non-overlapping April-March weather years (15 x 1 year).
  weather_2009_1y: [weather_2009]
  weather_2010_1y: [weather_2010]
  weather_2011_1y: [weather_2011]
  weather_2012_1y: [weather_2012]
  weather_2013_1y: [weather_2013]
  weather_2014_1y: [weather_2014]
  weather_2015_1y: [weather_2015]
  weather_2016_1y: [weather_2016]
  weather_2017_1y: [weather_2017]
  weather_2018_1y: [weather_2018]
  weather_2019_1y: [weather_2019]
  weather_2020_1y: [weather_2020]
  weather_2021_1y: [weather_2021]
  weather_2022_1y: [weather_2022]
  weather_2023_1y: [weather_2023]

  # Short, nested debugging horizons within weather year 2016.
  weather_2016_1m: [subset_2016_1m]
  weather_2016_3m: [subset_2016_3m]
  weather_2016_6m: [subset_2016_6m]

  # Complete, non-overlapping 5-year periods (3 x 5 years).
  weather_2009_5y: [subset_2009_5y]
  weather_2014_5y: [subset_2014_5y]
  weather_2019_5y: [subset_2019_5y]

  # Overlapping 10-year periods and the full 15-year record.
  weather_2009_10y: [subset_2009_10y]
  weather_2014_10y: [subset_2014_10y]
  weather_2009_15y: [subset_2009_15y]


overrides:
  # One-year weather windows (April-March).
  weather_2009:
    config.init.subset.timesteps: ['2009-04-01', '2010-03-31']
  weather_2010:
    config.init.subset.timesteps: ['2010-04-01', '2011-03-31']
  weather_2011:
    config.init.subset.timesteps: ['2011-04-01', '2012-03-31']
  weather_2012:
    config.init.subset.timesteps: ['2012-04-01', '2013-03-31']
  weather_2013:
    config.init.subset.timesteps: ['2013-04-01', '2014-03-31']
  weather_2014:
    config.init.subset.timesteps: ['2014-04-01', '2015-03-31']
  weather_2015:
    config.init.subset.timesteps: ['2015-04-01', '2016-03-31']
  weather_2016:
    config.init.subset.timesteps: ['2016-04-01', '2017-03-31']
  weather_2017:
    config.init.subset.timesteps: ['2017-04-01', '2018-03-31']
  weather_2018:
    config.init.subset.timesteps: ['2018-04-01', '2019-03-31']
  weather_2019:
    config.init.subset.timesteps: ['2019-04-01', '2020-03-31']
  weather_2020:
    config.init.subset.timesteps: ['2020-04-01', '2021-03-31']
  weather_2021:
    config.init.subset.timesteps: ['2021-04-01', '2022-03-31']
  weather_2022:
    config.init.subset.timesteps: ['2022-04-01', '2023-03-31']
  weather_2023:
    config.init.subset.timesteps: ['2023-04-01', '2024-03-31']

  # Short debugging windows (starting at the same point as weather_2016_1y).
  subset_2016_1m:
    config.init.subset.timesteps: ['2016-04-01', '2016-04-30']
  subset_2016_3m:
    config.init.subset.timesteps: ['2016-04-01', '2016-06-30']
  subset_2016_6m:
    config.init.subset.timesteps: ['2016-04-01', '2016-09-30']

  # Five-year windows covering the whole 15-year time series without gaps.
  subset_2009_5y:
    config.init.subset.timesteps: ['2009-04-01', '2014-03-31']
  subset_2014_5y:
    config.init.subset.timesteps: ['2014-04-01', '2019-03-31']
  subset_2019_5y:
    config.init.subset.timesteps: ['2019-04-01', '2024-03-31']

  # Ten-year windows and entire available period.
  subset_2009_10y:
    config.init.subset.timesteps: ['2009-04-01', '2019-03-31']
  subset_2014_10y:
    config.init.subset.timesteps: ['2014-04-01', '2024-03-31']
  subset_2009_15y:
    config.init.subset.timesteps: ['2009-04-01', '2024-03-31']
