# =============================================================================
# TECHNOLOGY DEFINITIONS
# =============================================================================
#
# Cost convention used throughout this file:
#   power CAPEX:        million EUR / MW
#   energy CAPEX:       million EUR / MWh
#   fixed O&M (power):  million EUR / MW / year
#   fixed O&M (energy): million EUR / MWh / year
#   variable OPEX:      million EUR / MWh throughput
#
# Primary source for non-UHS techno-economic assumptions:
#   PyPSA technology-data, 2030 output (used by the PyPSA model family)
#   https://github.com/PyPSA/technology-data
#   https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
#   Accessed 2026-10-08.
#
# Values from PyPSA which are quoted as FOM [% of CAPEX/year] are converted
# here to absolute annual O&M because Calliope's `cost_om_annual` is an
# absolute cost per unit of installed capacity.
#
# =============================================================================

techs:

  # ===========================================================================
  # VARIABLE RENEWABLE GENERATION
  #
  # `source_use_max` time series will be attached separately. With
  # `source_unit: per_cap`, these are interpreted as per-unit availability /
  # capacity-factor series.
  # ===========================================================================

  solar:
    name: "Utility Solar PV"
    base_tech: supply
    carrier_out: power
    source_unit: per_cap
    # Source: PyPSA technology-data 2030, `solar-utility`.
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 40
    cost_flow_cap:                    # 482.4785 EUR/kW = 0.4824785 MEUR/MW
      data: 0.4824785
      index: monetary
      dims: costs
    cost_om_annual:                   # 2.4757%/yr * CAPEX
      data: 0.0119447202
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.0                       # No utility-PV VOM reported; assumed zero
      index: monetary
      dims: costs

  onshore_wind:
    name: "Onshore Wind"
    base_tech: supply
    carrier_out: power
    source_unit: per_cap
    # Source: PyPSA technology-data 2030, `onwind`.
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 30
    cost_flow_cap:                    # 1383.3059 EUR/kW
      data: 1.3833059
      index: monetary
      dims: costs
    cost_om_annual:                   # 1.2167%/yr * CAPEX
      data: 0.0168306829
      index: monetary
      dims: costs
    cost_flow_out:                    # 1.8033 EUR/MWh
      data: 0 # identified value causes numerical instability and is omitted: 0.0000018033
      index: monetary
      dims: costs

  offshore_wind:
    name: "Offshore Wind"
    base_tech: supply
    carrier_out: power
    source_unit: per_cap
    # Provisional 2030 fixed-bottom AC-connected offshore-wind design.
    # All-in CAPEX constructed from the documented PyPSA-Earth / DEA 2030
    # component-cost basis (not the grid-excluding `offwind` row alone):
    #   turbines/plant            1,640 EUR/kW    = 1.64000 MEUR/MW
    #   AC station                  250 EUR/kW    = 0.25000 MEUR/MW
    #   60 km submarine cable     2,685 EUR/MW/km = 0.16110 MEUR/MW
    #   10 km land connection     1,342 EUR/MW/km = 0.01342 MEUR/MW
    #   total                                    = 2.06452 MEUR/MW
    # This is a transparent generic connection-distance assumption, NOT a
    # site-specific Netherlands estimate. For updated scenarios, DEA's 2025
    # grid-cost brief reports higher connection costs (~0.84 MEUR/MW in 2025).
    # Source: https://pypsa-earth.readthedocs.io/en/v0.4.1/costs.html
    # Updated grid-cost context: https://ens.dk/media/6708/download
    # FOM: 2.304878% of all-in CAPEX/year; same 2030 PyPSA-Earth offwind
    # fractional rate applied to the whole facility as a screening assumption.
    # VOM: 2.7 EUR/MWh_e in that 2030 table. No fuel cost for offshore wind.
    lifetime: 30
    cost_flow_cap:
      data: 2.06452
      index: monetary
      dims: costs
    cost_om_annual:
      data: 0.0475846673
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0 # identified value causes numerical instability and is omitted: 0.0000027
      index: monetary
      dims: costs


  # ===========================================================================
  # FIRM / DISPATCHABLE GENERATION
  #
  # These remain simple electricity `supply` technologies. Where PyPSA provides
  # a fuel price and conversion efficiency, fuel cost is folded into
  # `cost_flow_out`:
  #
  #     marginal cost = VOM + fuel_cost / efficiency
  #
  # This avoids introducing explicit fuel-carrier networks solely for these
  # background generation technologies.
  # ===========================================================================

  nuclear:
    name: "Nuclear"
    base_tech: supply
    carrier_out: power
    # Source: PyPSA technology-data 2030, `nuclear`.
    # CAPEX/FOM/VOM basis ultimately from Lazard v16; fuel from TYNDP inputs.
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 40
    cost_flow_cap:                    # 10805.7038 EUR/kW
      data: 10.8057038
      index: monetary
      dims: costs
    cost_om_annual:                   # 1.27%/yr * CAPEX
      data: 0.1372324383
      index: monetary
      dims: costs
    cost_flow_out:                    # 4.459 + 7.4536 / 0.326 = 27.3228 EUR/MWh_e
      data: 0.0000273228
      index: monetary
      dims: costs

  biomass:
    name: "Biomass Power"
    base_tech: supply
    carrier_out: power
    # Source: PyPSA technology-data 2030.
    # Plant proxy: `central solid biomass CHP`, electricity-side parameters.
    # Fuel: `solid biomass`.
    # Because this model is electricity-only, heat output is ignored and fuel
    # cost is folded into electricity marginal cost.
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 25
    cost_flow_cap:                    # 4474.2578 EUR/kW_e
      data: 4.4742578
      index: monetary
      dims: costs
    cost_om_annual:                   # 2.8661%/yr * CAPEX
      data: 0.1282367028
      index: monetary
      dims: costs
    cost_flow_out:                    # 6.1237 + 17.3312 / 0.2699 = 70.3371 EUR/MWh_e
      data: 0.0000703371
      index: monetary
      dims: costs

  # Geothermal deliberately disabled for the initial CEM tests: there is not
  # yet a country-specific resource potential, and the prior ORC-only proxy
  # omitted the geothermal wellfield and drilling costs. Reintroduce only
  # alongside a defensible geothermal resource limit and all-in CAPEX.


  # ===========================================================================
  # RUN-OF-RIVER HYDRO
  #
  # Modelled as non-storing supply. Country-specific existing/resource
  # capacities should be constrained in scenarios because new RoR expansion is
  # generally not freely available.
  #
  # `source_use_max` should be an electrical availability / capacity-factor
  # series. Therefore source_eff = 1 rather than reapplying PyPSA's 0.9
  # hydrological conversion efficiency to an already-electrical profile.
  # ===========================================================================

  hydro_run_of_river:
    name: "Run-of-River Hydro"
    base_tech: supply
    carrier_out: power
    source_unit: per_cap
    source_eff: 1.0
    # Source: PyPSA technology-data 2030, `ror`.
    # PyPSA notes these are legacy DIW / IEA assumptions.
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 80
    cost_flow_cap:                    # 4332.7919 EUR/kW_el
      data: 4.3327919
      index: monetary
      dims: costs
    cost_om_annual:                   # 2.0%/yr * CAPEX
      data: 0.0866558380
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.0                       # No RoR VOM supplied
      index: monetary
      dims: costs


  # ===========================================================================
  # CONVENTIONAL ELECTRICITY STORAGE
  #
  # These technologies use Calliope's native storage formulation.
  #
  # Batteries:
  #   exact duration is imposed by setting both native P/E ratio bounds to
  #   1/duration. Battery CAPEX is intentionally priced entirely against
  #   `storage_cap` [MWh], not `flow_cap` [MW].
  #
  #   PyPSA components:
  #       battery inverter = 213.9279 EUR/kW
  #       battery storage  = 189.8610 EUR/kWh
  #
  #   For a fixed duration D:
  #
  #       all-in CAPEX [EUR/kWh] =
  #           battery_storage + battery_inverter / D
  #
  #   Thus there is NO `cost_flow_cap` on the batteries below.
  #
  #   PyPSA quotes inverter efficiency = 0.96 as round-trip efficiency; PyPSA
  #   applies sqrt(0.96) symmetrically to charge and discharge, which we mirror.
  #
  # ===========================================================================

  battery_2h:
    name: "Lithium-Ion Battery - 2 h"
    base_tech: storage
    carrier_in: power
    carrier_out: power
    # Source: PyPSA technology-data 2030, `battery inverter` + `battery storage`.
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    # Composite lifetime is a modelling assumption: 20 y, between PyPSA's
    # 10-y inverter and 25-y storage-component lifetimes.
    lifetime: 20
    cyclic_storage: true
    flow_cap_per_storage_cap_min: 0.5
    flow_cap_per_storage_cap_max: 0.5
    flow_in_eff: 0.9797958971
    flow_out_eff: 0.9797958971
    storage_loss: 2.7916e-5  # 2% per 30 days https://doi.org/10.1016/j.egyr.2023.10.031
    cost_storage_cap:                # 189.861 + 213.9279/2 = 296.82495 EUR/kWh
      data: 0.2968249500
      index: monetary
      dims: costs
    cost_om_annual:                  # inverter FOM: 0.3375%/yr * 213.9279 EUR/kW
      data: 0.0007220067
      index: monetary
      dims: costs
    cost_flow_in:
      data: 0.0                      # No battery VOM in selected PyPSA rows
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.0
      index: monetary
      dims: costs

  battery_4h:
    name: "Lithium-Ion Battery - 4 h"
    base_tech: storage
    carrier_in: power
    carrier_out: power
    # Source/basis: same as battery_2h.
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 20
    cyclic_storage: true
    flow_cap_per_storage_cap_min: 0.25
    flow_cap_per_storage_cap_max: 0.25
    flow_in_eff: 0.9797958971
    flow_out_eff: 0.9797958971
    storage_loss: 2.7916e-5  # 2% per 30 days https://doi.org/10.1016/j.egyr.2023.10.031
    cost_storage_cap:                # 189.861 + 213.9279/4 = 243.342975 EUR/kWh
      data: 0.2433429750
      index: monetary
      dims: costs
    cost_om_annual:
      data: 0.0007220067
      index: monetary
      dims: costs
    cost_flow_in:
      data: 0.0
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.0
      index: monetary
      dims: costs

  battery_8h:
    name: "Lithium-Ion Battery - 8 h"
    base_tech: storage
    carrier_in: power
    carrier_out: power
    # Source/basis: same as battery_2h.
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 20
    cyclic_storage: true
    flow_cap_per_storage_cap_min: 0.125
    flow_cap_per_storage_cap_max: 0.125
    flow_in_eff: 0.9797958971
    flow_out_eff: 0.9797958971
    storage_loss: 2.7916e-5  # 2% per 30 days https://doi.org/10.1016/j.egyr.2023.10.031
    cost_storage_cap:                # 189.861 + 213.9279/8 = 216.6019875 EUR/kWh
      data: 0.2166019875
      index: monetary
      dims: costs
    cost_om_annual:
      data: 0.0007220067
      index: monetary
      dims: costs
    cost_flow_in:
      data: 0.0
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.0
      index: monetary
      dims: costs
  # ===========================================================================
  # Long-duration energy storage
  #
  # These use the custom `uhs_storage_formulations.yaml` math.
  # ===========================================================================

  compressed_air_storage:
    name: "Compressed Air Energy Storage"
    base_tech: storage
    carrier_in: power
    carrier_out: power
    # Source: PyPSA technology-data 2030:
    # Compressed-Air-Adiabatic-bicharger + Compressed-Air-Adiabatic-store
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 60
    cyclic_storage: true
    # Use custom storage formulation so power-side and energy-side fixed O&M can be represented separately.
    # PyPSA provides one symmetric "bicharger" power component.
    # Setting WTIR = 1 preserves identical injection/withdrawal ratings.
    # The bicharger CAPEX and FOM are divided equally between the two
    # custom power-capacity variables to avoid double counting.
    storage_formulation: partially_decoupled
    withdrawal_to_injection_ratio: 1
    # No EPR constraint:
    # storage duration is chosen endogenously by the optimiser.
    # PyPSA reports sqrt(0.52) = 0.7211 for each direction,
    # corresponding to 52% AC-AC round-trip efficiency.
    flow_in_eff: 0.7211
    flow_out_eff: 0.7211
    storage_loss: 2.0886e-4  # 0.5% per day https://iea-es.org/wp-content/uploads/public/FactSheet_mechanical_CAES.pdf
    cost_flow_in_cap: # 50% of 1.1896660381 MEUR/MW bicharger CAPEX
        data: 0.5948330191
        index: monetary
        dims: costs
    cost_om_annual_flow_in_cap: # 50% of bicharger FOM: 1.1896660381 * 0.9265% / 2
        data: 0.0055111279
        index: monetary
        dims: costs
    cost_flow_out_cap: # 50% of 1.1896660381 MEUR/MW bicharger CAPEX
        data: 0.5948330191
        index: monetary
        dims: costs
    cost_om_annual_flow_out_cap: # 50% of bicharger FOM: 1.1896660381 * 0.9265% / 2
        data: 0.0055111279
        index: monetary
        dims: costs
    cost_storage_cap: # 6,850.9515 EUR/MWh
        data: 0.0068509515
        index: monetary
        dims: costs
    cost_om_annual_storage_cap: # 0.43%/yr * storage CAPEX
        data: 0.0000294591
        index: monetary
        dims: costs

  pumped_hydro:
    name: "Pumped Hydro Storage"
    base_tech: storage
    carrier_in: power
    carrier_out: power
    # Source: PyPSA technology-data 2030:
    # Pumped-Storage-Hydro-bicharger + Pumped-Storage-Hydro-store
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 60
    cyclic_storage: true
    # Symmetric conventional storage:
    # P_out = P_in, but storage energy capacity remains independently sized.
    storage_formulation: partially_decoupled
    withdrawal_to_injection_ratio: 1
    # No EPR constraint: 
    # storage duration is endogenous.
    # PyPSA reports sqrt(0.8) = 0.8944 in each direction,
    # giving approximately 80% round-trip efficiency.
    flow_in_eff: 0.8944
    flow_out_eff: 0.8944
    storage_loss: 0.0
    cost_flow_in_cap: # 50% of 1.7566579565 MEUR/MW bicharger CAPEX
        data: 0.8783289783
        index: monetary
        dims: costs
    cost_om_annual_flow_in_cap: # 50% of power-component FOM: 1.7566579565 * 0.9951% / 2
        data: 0.0087402517
        index: monetary
        dims: costs
    cost_flow_out_cap: # 50% of 1.7566579565 MEUR/MW bicharger CAPEX
        data: 0.8783289783
        index: monetary
        dims: costs
    cost_om_annual_flow_out_cap: # 50% of power-component FOM: 1.7566579565 * 0.9951% / 2
        data: 0.0087402517
        index: monetary
        dims: costs
    cost_storage_cap: # 71,761.1936 EUR/MWh
        data: 0.0717611936
        index: monetary
        dims: costs
    cost_om_annual_storage_cap: # 0.43%/yr * storage CAPEX
        data: 0.0003085731
        index: monetary
        dims: costs

  # ===========================================================================
  # HYDROGEN CONVERSION
  # ===========================================================================

  electrolyser:
    name: "Electrolyser"
    base_tech: conversion
    carrier_in: power
    carrier_out: hydrogen
    # Source: PyPSA technology-data 2030, `electrolysis` (100 MW AEC basis).
    # https://raw.githubusercontent.com/PyPSA/technology-data/master/outputs/costs_2030.csv
    lifetime: 25
    flow_out_eff: 0.6217
    # CAPEX/FOM are indexed to the electrical-input carrier because the quoted
    # plant capacity is EUR/kW_e input.
    cost_flow_cap:
      data: [1.8860019]               # 1886.0019 EUR/kW_e
      index: [[monetary, power]]
      dims: [costs, carriers]
    cost_om_annual:
      data: [0.0754400760]            # 4.0%/yr * CAPEX
      index: [[monetary, power]]
      dims: [costs, carriers]
    cost_flow_out:
      data: 0.0                       # No VOM in selected `electrolysis` row
      index: monetary
      dims: costs

  h2_ccgt:
    name: "Hydrogen Combined Cycle Gas Turbine"
    base_tech: conversion
    carrier_in: hydrogen
    carrier_out: power
    # New-build hydrogen-fired CCGT; not a natural-gas CCGT proxy.
    # Source: Aurora Energy Research (2021), CO2-free flexibility options
    # for the Dutch power system, commissioned by the Dutch government,
    # Appendix chapter 1, "Hydrogen-burning assets", 2030 case (EUR_2020):
    #   CAPEX 650,000 EUR/MW_el; FOM 19,000 EUR/MW_el/year;
    #   VOM 2 EUR/MWh_el; lifetime 30 years;
    #   electricity efficiency 55-60% on the HHV basis (new-build).
    # https://www.rijksoverheid.nl/binaries/rijksoverheid/documenten/rapporten/2022/01/19/co2-free-flexibility-options-for-the-dutch-power-system-door-aurora/Studie_CO2_free_flexibility_options_for_the_Dutch_power_system.PDF
    # CEM uses hydrogen energy on an LHV basis: 0.55 HHV * 1.183 ~= 0.651 LHV.
    # Conservatively use the low end (0.65 LHV) for initial testing.
    # Fuel cost is deliberately excluded: hydrogen is an explicit carrier.
    # IMPORTANT: this H2-CCGT source quotes real 2020 EUR, whereas the
    # PyPSA technology costs elsewhere in this file have another cost-year
    # basis. Harmonise price years before drawing economic conclusions.
    lifetime: 30
    flow_out_eff: 0.65
    cost_flow_cap:
      data: [0.65]
      index: [[monetary, power]]
      dims: [costs, carriers]
    cost_om_annual:
      data: [0.019]
      index: [[monetary, power]]
      dims: [costs, carriers]
    cost_flow_out:
      data: 0 # identified value causes numerical instability and is omitted: 0.000002
      index: monetary
      dims: costs

  # ===========================================================================
  # DEMAND
  # ===========================================================================

  demand_power:
    name: "Electricity Demand"
    base_tech: demand
    carrier_in: power

