# AUTO-GENERATED from the combined UHS cost-rates CSV; do not edit sample rates here.
# Units: MWh hydrogen energy and matching power capacity (MW).
# Monetary coefficients are million EUR per MWh or matching power unit.
# EPR parameters are hours (CSV EPR days multiplied by 24); WTIR is dimensionless.
# EPR is interpreted by the custom maths as power <=/>= storage_cap / EPR.
# B1/B25: both ratios exact; P1: WTIR exact and EPR interval;
# F1/FX1/FX2/FX4: both ratio intervals constrain otherwise-independent capacities.
# Only the last sampled EPR bin has its upper limit multiplied by 2;
# only the last sampled WTIR bin has its upper limit multiplied by 2.
# Original sample boundaries, cost rates, and bundled equality ratios are unchanged.
# Extended intervals go beyond the range of the sampled cost-rate fits.
# Compression is represented through flow_in_eff / flow_out_eff only;
# raw compressor-electricity metadata is intentionally not exported.
# 24-hour SoC coefficients are applied by uhs_storage_formulations.yaml.
# All UHS technologies are cyclic with lifetime 50 years.
# Cost annualisation uses the interest rate defined in the main model.
# Positive VOM coefficients below EUR 0.10/MWh are set to zero.
# CAPEX and annual fixed O&M are never clipped.
# Adjacent sample cells share LP-compatible non-strict interval boundaries.

