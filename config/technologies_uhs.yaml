# AUTO-GENERATED from the combined UHS cost-rates CSV; do not edit sample rates here.
# Units: MWh hydrogen energy and matching power capacity (MW).
# Monetary coefficients are EUR per MWh or its matching power unit.
# EPR parameters are hours (CSV EPR days multiplied by 24); WTIR is dimensionless.
# B1/B30: both ratios exact; P1: WTIR exact and EPR interval;
# F1/FX1/FX6: both ratio intervals constrain otherwise-independent capacities.
# CSV experiments PD1 and FD1 become scenario prefixes P1 and F1.
# H2 purification recovery is mapped to flow_out_eff; compressor-electricity
# demand is preserved as separate technology parameters and is NOT YET
# linked to electricity consumption in the custom maths.
# SoC 24 h coefficients are exported for salt caverns but are NOT YET
# operational constraints: they require a separate custom-math extension.
# Set technology lifetimes and financial interest-rate assumptions before
# using the investment costs in production CEM runs.
# Adjacent sample cells share LP-compatible non-strict interval boundaries.

